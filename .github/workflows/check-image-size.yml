name: Check Image Size

on:
  pull_request:
    # 当 PR 的目标分支为以下分支时触发
    branches:
      - main
      - master
      - develop
  push: 
    # 当 PR 的目标分支为以下分支时触发
    branches:
      - main
      - master
      - develop

jobs:
  check-image-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，便于比较

      # 获取本次 PR 中变更的图片文件列表
      - name: Get changed image files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          # 指定要匹配的图片扩展名（不区分大小写）
          files: |
            **/*.png
            **/*.jpg
            **/*.jpeg
            **/*.gif
            **/*.bmp
            **/*.webp
            **/*.svg
            **/*.ico
            **/*.tiff

      # 检查每个图片文件的大小
      - name: Check image sizes
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          SIZE_LIMIT=20480   # 20KB = 20480 字节
          ERROR_FILES=()

          for file in ${ALL_CHANGED_FILES}; do
            # 获取文件大小（字节）
            size=$(stat -c%s "$file" 2>/dev/null || echo 0)
            if [ "$size" -gt "$SIZE_LIMIT" ]; then
              ERROR_FILES+=("$file ($size bytes)")
            fi
          done

          if [ ${#ERROR_FILES[@]} -ne 0 ]; then
            echo "❌ The following image files exceed 20KB:"
            for err in "${ERROR_FILES[@]}"; do
              echo "  - $err"
            done
            exit 1
          else
            echo "✅ All image files are within the 20KB limit."
          fi
